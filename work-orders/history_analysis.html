<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부서 상세 이력 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .duplicate-row {
            transition: all 0.3s ease;
        }

        .duplicate-row.open {
            background: rgba(59, 130, 246, 0.03);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="app" class="p-4 md:p-8 max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-4 mb-8">
            <a href="total_stats.html"
                class="p-2.5 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-all shadow-sm">
                <i data-lucide="arrow-left" class="w-6 h-6 text-slate-600"></i>
            </a>
            <div>
                <h1 id="dept-title" class="text-2xl md:text-3xl font-black tracking-tight text-slate-900">부서 분석 <span
                        class="text-blue-600">History</span></h1>
                <p class="text-slate-500 font-bold text-xs tracking-wide uppercase mt-1">Duplicate Work Detection &
                    Management</p>
            </div>
        </div>

        <!-- summary stats for analysis -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">중복 작업 그룹</p>
                <p id="dup-groups" class="text-3xl font-black text-slate-900">0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">중복 발생 건수</p>
                <p id="dup-total-count" class="text-3xl font-black text-blue-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm col-span-2 md:col-span-1">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">중복 작업 총 공량</p>
                <p id="dup-total-mh" class="text-3xl font-black text-slate-900">0 <span
                        class="text-sm text-slate-400">M/H</span></p>
            </div>
        </div>

        <div class="mb-4 flex items-center justify-between px-2">
            <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                <i data-lucide="layers" class="text-blue-500"></i> 집중 관리 대상 (2회 이상 반복)
            </h3>
            <span id="target-dept-label"
                class="px-3 py-1 bg-slate-200 text-slate-700 text-[10px] font-black rounded-full uppercase">---</span>
        </div>

        <!-- Result List -->
        <div id="duplicate-list" class="space-y-4">
            <!-- Loading State -->
            <div class="bg-white p-12 rounded-[2rem] border border-slate-100 shadow-sm text-center">
                <div
                    class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-4">
                </div>
                <p class="text-slate-500 font-bold">데이터 분석 중...</p>
            </div>
        </div>
    </div>

    <script>
        const DEPARTMENTS = [
            { name: '터빈전기과', url: 'https://script.google.com/macros/s/AKfycbxWHz_YXzcB1GK_2nuDrsoj0utHHKzuIOBxOwGb7GEDEf4d29yO5Sghia6H60g9kHDKUA/exec' },
            { name: '보일러전기과', url: 'https://script.google.com/macros/s/AKfycbztiL9SS1UnMbM00yKfiDLnNkLNjmAGCP1vwDs0mcjUohp9lgDy9NB9z47SvulvIeuGFQ/exec' },
            { name: '전력기기과', url: 'https://script.google.com/macros/s/AKfycbwJJQj2kHIXFm4yjlV5hTQbNShlZ1lwVYZC37mXHOxnT_W5SHztcUkY9yEv-tNZnana/exec' },
            { name: '전자회로과', url: 'https://script.google.com/macros/s/AKfycbwsP64-5IFbT8aqGm8sGqG4xbzJVX8lEhMS23coatKlcTlpgiwlw5xpU5Q1i4cQbCmU/exec' },
            { name: '탈황전기과', url: 'https://script.google.com/macros/s/AKfycbyPvldzj-jHf2FP3NmyTCPCUV_P6v57FdxBPZEWGaNpfwTIKYfZkKYf13aWJEO0U72CZA/exec' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const targetDeptName = urlParams.get('dept');

        async function initAnalysis() {
            lucide.createIcons();
            if (!targetDeptName) {
                document.getElementById('duplicate-list').innerHTML = '<div class="p-8 text-center text-red-500 font-black">부서 정보가 없습니다.</div>';
                return;
            }

            document.getElementById('target-dept-label').innerText = targetDeptName;
            const dept = DEPARTMENTS.find(d => d.name === targetDeptName);
            if (!dept) return;

            try {
                const response = await fetch(`${dept.url}?_t=${Date.now()}`);
                const data = await response.json();
                processDuplicates(data.tasks || []);
            } catch (error) {
                console.error('Data Load Error:', error);
                document.getElementById('duplicate-list').innerHTML = '<div class="p-8 text-center text-red-500 font-black">데이터를 불러오지 못했습니다.</div>';
            }
        }

        function processDuplicates(tasks) {
            const groups = [];
            const actionKeywords = ['점검', '정비', '교체', '수리', '확인', '조치', '작업', '오버홀', '보수', '청소', '테스트'];

            // 1. Normalize and tokenize tasks
            const processedTasks = tasks.map(t => {
                const rawTitle = t.title || t['오더제목'] || t['제목'] || '제목 없음';
                let cleanTitle = String(rawTitle).replace(/^\[.*?\]\s*/, '').trim();

                // Remove action keywords from end
                let coreTitle = cleanTitle;
                actionKeywords.forEach(kw => {
                    const regex = new RegExp(`\\s*${kw}\\s*$`, 'g');
                    coreTitle = coreTitle.replace(regex, '');
                });

                // Get words for similarity check
                const words = coreTitle.toLowerCase().replace(/[^a-z0-9가-힣\s]/g, '').split(/\s+/).filter(w => w.length > 0);

                return {
                    original: t,
                    rawTitle,
                    cleanTitle,
                    coreTitle,
                    words: new Set(words),
                    wordArray: words,
                    manHour: parseFloat(t.manHour || t['공량'] || 0) || 0
                };
            }).filter(t => t.wordArray.length > 0);

            // 2. Similarity-based grouping (Jaccard Index)
            const visited = new Set();
            for (let i = 0; i < processedTasks.length; i++) {
                if (visited.has(i)) continue;

                const current = processedTasks[i];
                const activeGroup = {
                    displayTitle: current.coreTitle,
                    items: [current],
                    totalMh: current.manHour
                };
                visited.add(i);

                for (let j = i + 1; j < processedTasks.length; j++) {
                    if (visited.has(j)) continue;

                    const target = processedTasks[j];

                    // Jaccard Similarity (Intersection / Union)
                    const intersection = new Set([...current.words].filter(x => target.words.has(x)));
                    const union = new Set([...current.words, ...target.words]);
                    const similarity = intersection.size / union.size;

                    // 0.6 (60%) 이상의 단어가 겹치면 동일 그룹으로 간주
                    // 또는 하나가 다른 하나의 큰 부분집합인 경우 (예: "펌프 점검" vs "펌프")
                    const isSubset = intersection.size === Math.min(current.words.size, target.words.size) && intersection.size >= 2;

                    if (similarity >= 0.6 || isSubset) { // Changed threshold to 0.6 as per instruction
                        activeGroup.items.push(target);
                        activeGroup.totalMh += target.manHour;
                        visited.add(j);

                        // 대표 제목을 더 짧은 것으로 유지 (장비명일 가능성이 높음)
                        if (target.coreTitle.length < activeGroup.displayTitle.length) {
                            activeGroup.displayTitle = target.coreTitle;
                        }
                    }
                }

                if (activeGroup.items.length >= 2) {
                    groups.push(activeGroup);
                }
            }

            // 3. Final display mapping
            const finalGroups = groups.map(g => ({
                displayTitle: g.displayTitle,
                totalMh: g.totalMh,
                items: g.items.map(pt => ({
                    title: pt.rawTitle,
                    orderNo: pt.original.orderNo || pt.original['오더번호'] || '-',
                    manHour: pt.manHour,
                    status: pt.original.status || pt.original['상태'] || '-',
                    designer: pt.original.designer || pt.original['설계자'] || '-',
                    date: pt.original.deadline || pt.original.date || pt.original['날짜'] || '--'
                }))
            })).sort((a, b) => b.items.length - a.items.length || b.totalMh - a.totalMh);

            renderDuplicates(finalGroups);
            renderStats(finalGroups);
        }

        function renderStats(duplicates) {
            const totalGroups = duplicates.length;
            const totalCount = duplicates.reduce((sum, g) => sum + g.items.length, 0);
            const totalMh = duplicates.reduce((sum, g) => sum + g.totalMh, 0);

            document.getElementById('dup-groups').innerText = totalGroups.toLocaleString();
            document.getElementById('dup-total-count').innerText = totalCount.toLocaleString();
            document.getElementById('dup-total-mh').innerHTML = `${totalMh.toLocaleString()} <span class="text-sm text-slate-400">M/H</span>`;
        }

        function renderDuplicates(duplicates) {
            const listEl = document.getElementById('duplicate-list');
            if (duplicates.length === 0) {
                listEl.innerHTML = '<div class="bg-white p-12 rounded-[2rem] border border-slate-100 shadow-sm text-center text-slate-400 font-bold">중복된 작업이 발견되지 않았습니다.</div>';
                return;
            }

            listEl.innerHTML = duplicates.map((g, idx) => `
                <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden duplicate-row" id="group-${idx}">
                    <div onclick="toggleGroup(${idx})" class="p-5 md:p-6 cursor-pointer flex items-center justify-between hover:bg-slate-50 transition-colors">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[9px] font-black rounded-full uppercase tracking-tighter">Title</span>
                                <span class="text-[10px] font-black text-slate-400 uppercase">Occurrence: ${g.items.length}회</span>
                            </div>
                            <h4 class="text-base md:text-lg font-black text-slate-800 leading-tight">${g.displayTitle}</h4>
                            <div class="flex items-center gap-4 mt-2">
                                <div class="flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3 text-slate-400"></i>
                                    <span class="text-[10px] font-bold text-slate-500">누적 공량: ${g.totalMh.toLocaleString()} M/H</span>
                                </div>
                            </div>
                        </div>
                        <div id="icon-${idx}" class="p-2 text-slate-300 transition-transform">
                            <i data-lucide="chevron-down" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <div id="content-${idx}" class="hidden border-t border-slate-50 bg-slate-50/30">
                        <div class="p-5 md:p-6 space-y-3">
                            ${g.items.map(item => `
                                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
                                    <div>
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-[9px] font-black text-slate-400 uppercase">No. ${item.orderNo}</span>
                                            <span class="w-1 h-2 bg-slate-200 rounded-full"></span>
                                            <span class="text-[10px] font-bold text-slate-400">${item.date}</span>
                                            <span class="w-1 h-3 bg-slate-200 rounded-full"></span>
                                            <span class="text-[10px] font-bold text-blue-600">${item.designer}</span>
                                        </div>
                                        <p class="text-xs font-bold text-slate-600">${item.title}</p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div class="px-3 py-1 bg-slate-50 rounded-lg text-center min-w-[60px]">
                                            <p class="text-[8px] font-bold text-slate-400 uppercase">MH</p>
                                            <p class="text-xs font-black text-slate-700">${item.manHour || 0}</p>
                                        </div>
                                        <div class="px-3 py-1 ${String(item.status).includes('완료') && !String(item.status).includes('미완료') ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-400'} rounded-lg text-center min-w-[60px]">
                                            <p class="text-[8px] font-bold opacity-70 uppercase">Status</p>
                                            <p class="text-xs font-black">${item.status || '진행중'}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function toggleGroup(idx) {
            const content = document.getElementById(`content-${idx}`);
            const row = document.getElementById(`group-${idx}`);
            const icon = document.getElementById(`icon-${idx}`);
            const isHidden = content.classList.contains('hidden');

            if (isHidden) {
                content.classList.remove('hidden');
                row.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                row.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        window.onload = initAnalysis;
    </script>
</body>

</html>
