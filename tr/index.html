                                                <div className="flex items-center gap-3">
                                                    <div className={`w-1.5 h-8 rounded-full ${item.status === 'CHECK' ? 'bg-amber-400' : 'bg-rose-500'}`}></div>
                                                    <div>
                                                        <div className="text-xs font-bold text-slate-800 flex items-center gap-1">
                                                            {item.zone.replace('ZONE ', '#')} - {item.side} SIDE <ChevronRight size={10} className="text-gray-300" /> PNL-{item.panelId} {!item.isPanelSummary && ` / Mod-${item.moduleId}`}
                                                        </div>
                                                        <div className="text-[10px] text-gray-500 mt-0.5 max-w-[180px] break-words"><SafeText value={item.desc} fallback={item.isPanelSummary ? '확인 필요' : ''} /></div>
                                                    </div>
                                                </div>
                                                <button onClick={() => onSelectLayout(item.zone)} className="px-2 py-1 bg-slate-50 text-slate-600 text-[10px] font-bold rounded border border-slate-200 hover:bg-white hover:text-blue-600 transition-colors">이동</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <footer className="mt-20 border-t border-slate-100 pt-8 text-center w-full max-w-sm">
                                <p className="text-slate-300 text-[10px] font-bold uppercase tracking-[0.3em]">
                                    &copy; 2024 One Plant Integrated System.
                                </p>
                            </footer>
                        </div>
                    </main>

                    {showGlobalHistory && <GlobalHistorySheet dataCache={globalData} onClose={() => setShowGlobalHistory(false)} />}
                </div>
            );
        };

        // --- Auth & Main App ---

        const SetupRequiredScreen = () => {
            // 이 화면은 API URL이 유효하지 않을 때만 표시됩니다.
            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-100 p-8 text-center">
                    <div className="bg-white p-8 rounded-xl shadow-xl max-w-md w-full border-2 border-rose-100">
                        <div className="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6">
                            <Settings size={32} />
                        </div>
                        <h1 className="text-2xl font-black text-slate-800 mb-2">Google Sheets API 설정 필요</h1>
                        <p className="text-gray-600 mb-6 leading-relaxed">
                            Apps Script 웹 앱 URL이 설정되지 않았거나 잘못되었습니다.<br />
                            <code className="bg-slate-100 px-2 py-1 rounded text-sm text-rose-600">index.html</code> 파일을 열어<br />
                            상단의 <strong>SHEET_API_URL</strong>에 정확한 URL을 입력해주세요.
                        </p>
                        <div className="bg-slate-50 p-4 rounded text-left text-xs font-mono text-slate-500 border border-slate-200 overflow-x-auto">
                            const SHEET_API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL";
                        </div>
                    </div>
                </div>
            );
        }

        const LoadingScreen = () => (
            <div className="min-h-screen flex flex-col items-center justify-center bg-white">
                <div className="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                <p className="text-slate-500 font-bold animate-pulse">시스템 접속 중...</p>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('MAIN');
            const [selectedLayout, setSelectedLayout] = useState(null);
            const isValid = useMemo(() => isConfigValid(), []);

            // [전역 상태] 모든 뷰에서 공유하는 데이터 캐시
            const [globalData, setGlobalData] = useState(() => {
                try {
                    const saved = localStorage.getItem('ep_manager_cache');
                    if (saved && saved !== 'undefined' && saved !== 'null') {
                        const parsed = JSON.parse(saved);
                        return (parsed && typeof parsed === 'object') ? parsed : {};
                    }
                } catch (e) {
                    console.error("Cache init error:", e);
                }
                return {};
            });

            // 데이터 업데이트 및 로컬 스토리지 동기화 함수
            const updateGlobalData = useCallback((key, data) => {
                if (!key || !data) return;
                setGlobalData(prev => {
                    const next = { ...prev, [key]: data };
                    setTimeout(() => {
                        try {
                            localStorage.setItem('ep_manager_cache', JSON.stringify(next));
                        } catch (e) {
                            console.error("Cache save error:", e);
                        }
                    }, 0);
                    return next;
                });
            }, []);

            if (!isValid) return <SetupRequiredScreen />;

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900">
                    <button
                        onClick={() => { if (confirm('결과 캐시를 삭제하고 다시 로드하시겠습니까?')) { localStorage.removeItem('ep_manager_cache'); window.location.reload(); } }}
                        className="fixed bottom-4 right-4 z-[100] p-2 bg-slate-200/50 hover:bg-slate-300 text-[10px] text-slate-500 rounded-md transition-all font-bold opacity-30 hover:opacity-100"
                    >
                        캐시 삭제
                    </button>
                    {view === 'DETAIL' ? (
                        <FieldLayout
                            onBack={() => { setSelectedLayout(null); setView('MAIN'); }}
                            layoutId={selectedLayout}
                            globalData={globalData}
                            updateGlobalData={updateGlobalData}
                        />
                    ) : (
                        <MainDashboard
                            onSelectLayout={(layoutId) => { setSelectedLayout(layoutId); setView('DETAIL'); }}
                            globalData={globalData}
                            updateGlobalData={updateGlobalData}
                        />
                    )}
                </div>
            );
        };

        try {
            console.log("Initializing React root...");
            const container = document.getElementById('root');
            if (!container) throw new Error("Root element not found!");
            const root = createRoot(container);
            root.render(<App />);
            console.log("React render call completed.");
        } catch (err) {
            console.error("Critical Render Error:", err);
            if (typeof showGlobalError === 'function') {
                showGlobalError(`컴포넌트 렌더링 실패: ${err.message}`, err.stack);
            } else {
                alert(`Critical Render Error: ${err.message}\n\n${err.stack}`);
            }
        }
        console.log("Babel script execution finished.");
    </script>
</body>

</html>
