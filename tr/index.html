<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP Manager (Google Sheets API)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Babel (JSX 변환기) - 특정 안정화 버전(7.23.10)으로 고정 -->
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0?dev",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
            "lucide-react": "https://esm.sh/lucide-react@0.454.0?deps=react@18.2.0"
        }
    }
    </script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script>
        // 이 변수들은 Canvas 환경에서 사용됩니다.
        if (typeof window.__firebase_config === 'undefined' && typeof __firebase_config === 'undefined') {
            window.__firebase_config = JSON.stringify({
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"
            });
        }
        if (typeof window.__app_id === 'undefined' && typeof __app_id === 'undefined') {
            window.__app_id = 'ep-manager-v1';
        }

        const appId = (typeof window.__app_id !== 'undefined' ? window.__app_id : 'ep-manager-v1');
        const firebaseConfig = JSON.parse(typeof window.__firebase_config !== 'undefined' ? window.__firebase_config : '{}');

        // 🚨 사용자님이 제공해주신 Apps Script URL 🚨
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxgS2_Quh2MCxGAebBf9Uydp7gR1UpKGoHfq4lt40H8LXh9zmTRfpFaEGVHnlhEVmetRA/exec";

        // --- Error Overlay for Debugging (Global) ---
        const showGlobalError = (msg, stack) => {
            const div = document.createElement('div');
            div.id = 'debug-error-overlay';
            div.className = 'fixed inset-0 z-[9999] bg-rose-600/95 text-white p-6 flex flex-col items-center justify-center text-center overflow-auto';
            div.innerHTML = `
                <div class="max-w-2xl w-full">
                    <h1 class="text-3xl font-black mb-2">CRITICAL ERROR</h1>
                    <div class="bg-black/20 p-4 rounded-lg mb-6 text-left">
                        <p class="text-lg font-bold mb-2">${msg}</p>
                        ${stack ? `<pre class="text-[10px] opacity-70 overflow-x-auto whitespace-pre-wrap max-h-40 border-t border-white/20 pt-2">${stack}</pre>` : ''}
                    </div>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <button onclick="localStorage.clear(); window.location.reload();" class="px-6 py-3 bg-white text-rose-600 rounded-xl font-bold shadow-lg hover:bg-rose-50 transition-colors">캐시 초기화 및 새로고침</button>
                        <button onclick="window.location.reload();" class="px-6 py-3 bg-rose-800 text-white rounded-xl font-bold hover:bg-rose-900 transition-colors">단순 새로고침</button>
                    </div>
                    <p class="mt-8 text-xs opacity-50 font-medium">위 에러 내용을 캡처해서 전달해주시면 더 빠른 해결이 가능합니다.</p>
                </div>
            `;
            document.body.appendChild(div);
        };

        window.onerror = (msg, url, line, col, error) => {
            console.error("Global Error Caught:", msg, error);
            showGlobalError(`${msg} (${line}:${col})`, error?.stack);
            return false;
        };

        console.log("System script initialized.");
    </script>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { X, Save, Settings, Activity, Zap, TriangleAlert, CircleCheck, ArrowLeft, FileText, Database, ChevronRight, Download, RefreshCw, CircleAlert, ExternalLink, Trash2, History, Cloud, List, ClipboardList, Cpu } from 'lucide-react';

        // --- Helper: Wait Function ---
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        console.log("Babel script starting...");

        // --- Sheets API Service using Fetch ---
        const SheetsAPIService = {
            getDoc: async (targetId, retries = 3) => {
                if (SHEET_API_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL")) {
                    throw new Error("API URL이 설정되지 않았거나 올바르지 않습니다. Apps Script URL을 확인하세요.");
                }

                const url = `${SHEET_API_URL}?id=${encodeURIComponent(targetId)}&t=${Date.now()}`;
                let lastError;

                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            redirect: 'follow',
                            credentials: 'omit'
                        });

                        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                        const result = await response.json();

                        if (result.error === "Data not initialized" || result.error === "Data corrupted") {
                            console.warn(`Data missing or corrupted for ${targetId}.`);
                            return null;
                        }
                        if (result.error) throw new Error(result.error);
                        return result;
                    } catch (error) {
                        lastError = error;
                        console.warn(`Attempt ${i + 1} failed for ${targetId}:`, error);
                        if (i < retries - 1) await wait(1000 * (i + 1));
                    }
                }
                console.error("Sheets GET Final Error:", lastError);
                throw lastError;
            },

            setDoc: async (targetId, data) => {
                if (SHEET_API_URL.includes("YOUR_APPS_SCRIPT_WEB_APP_URL")) {
                    throw new Error("API URL이 설정되지 않았거나 올바르지 않습니다.");
                }
                const postData = { id: targetId, data: data };
                try {
                    const response = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(postData),
                        credentials: 'omit'
                    });
                    const result = await response.json();
                    if (result.error) throw new Error(result.error);
                    if (result.status !== 'success') throw new Error("API 저장 실패: 응답 상태 불일치");
                    return true;
                } catch (error) {
                    console.error("Sheets POST Error:", error);
                    throw new Error("Sheets 데이터 저장 오류: " + error.message);
                }
            },
        };

        const isConfigValid = () => SHEET_API_URL !== "YOUR_APPS_SCRIPT_WEB_APP_URL";

        const generateData = (layoutId) => {
            const panelIds = ['31', '21', '22', '32', '11', '12'];
            const isZone4 = layoutId === 'ZONE 4';
            const moduleCountsZone3 = { '31': 6, '32': 6, '21': 4, '22': 4, '11': 4, '12': 4 };
            const data = {};
            panelIds.forEach(pId => {
                data[pId] = [];
                const count = isZone4 ? 1 : (moduleCountsZone3[pId] || 6);
                for (let m = 1; m <= count; m++) {
                    data[pId].push({
                        id: `${pId}-${m}`,
                        panelId: pId,
                        moduleId: m,
                        status: 'NORMAL',
                        technician: '',
                        memo: '',
                        updatedAt: new Date().toLocaleDateString(),
                        history: [],
                        errorCode: ''
                    });
                }
            });
            return { panels: data, createdAt: new Date().toISOString() };
        };

        const getStatusStyle = (status) => {
            switch (status) {
                case 'NORMAL': return { bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', indicator: 'bg-emerald-500', ring: 'focus:ring-emerald-500' };
                case 'CHECK': return { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', indicator: 'bg-amber-500', ring: 'focus:ring-amber-500' };
                case 'ERROR': return { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-700', indicator: 'bg-rose-600', ring: 'focus:ring-rose-500' };
                default: return { bg: 'bg-gray-50', border: 'border-gray-200', text: 'text-gray-600', indicator: 'bg-gray-500', ring: 'focus:ring-gray-500' };
            }
        };

        const getStatusIcon = (status, size = 14) => {
            switch (status) {
                case 'NORMAL': return <CircleCheck size={size} />;
                case 'CHECK': return <Activity size={size} />;
                case 'ERROR': return <TriangleAlert size={size} />;
                default: return null;
            }
        };

        const SafeText = ({ value, fallback = "내용없음" }) => {
            if (value === null || value === undefined || value === '') return <span className="text-gray-400">{fallback}</span>;
            if (typeof value === 'object') {
                if (value.$$typeof) return value; // It's an element
                return JSON.stringify(value);
            }
            if (value === '내용없음' || value === '초기화됨') return <span className="text-gray-400">{value}</span>;
            return value;
        };

        const CHECK_CODES = [
            { code: 'E01', label: 'HV-모듈 취외' },
            { code: 'E02', label: 'HV-모듈 고장' },
            { code: 'E03', label: 'Drive-모듈 취외' },
            { code: 'E04', label: 'Drive-모듈 고장' },
        ];

        const ERROR_CODES = [
            { code: 'E01', label: 'Display-모듈고장' },
            { code: 'E02', label: 'Display-기판고장' },
            { code: 'E03', label: '냉각/누유 문제' },
            { code: 'E04', label: '내부 문제' },
        ];

        const CustomConfirm = ({ message, onConfirm, onClose, title = "확인 필요", confirmLabel = "확인", confirmColor = "bg-rose-600", icon = <CircleAlert size={20} /> }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                <div className="bg-white rounded-xl w-full max-w-sm shadow-2xl border border-gray-200 overflow-hidden">
                    <div className={`px-6 py-4 border-b border-gray-100 flex justify-between items-center ${confirmColor.includes('rose') ? 'bg-rose-50' : 'bg-slate-50'}`}>
                        <h2 className={`text-lg font-bold flex items-center gap-2 ${confirmColor.includes('rose') ? 'text-rose-800' : 'text-slate-800'}`}>{icon} {title}</h2>
                        <button onClick={onClose} className={`p-2 rounded-full ${confirmColor.includes('rose') ? 'hover:bg-rose-100 text-rose-500' : 'hover:bg-gray-200 text-gray-500'}`}><X size={20} /></button>
                    </div>
                    <div className="p-6">
                        <p className="text-gray-700 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onClose} className="px-4 py-2 rounded-md text-sm font-bold text-gray-600 hover:bg-gray-200">취소</button>
                            <button onClick={onConfirm} className={`px-4 py-2 rounded-md text-sm font-bold text-white ${confirmColor} hover:${confirmColor.replace('600', '700')} flex items-center gap-1.5`}>{confirmLabel === "초기화" ? <Trash2 size={14} /> : null} {confirmLabel}</button>
                        </div>
                    </div>
                </div>
            </div>
        );


        const ModuleHistoryManager = ({ module, onClose, onDeleteHistory, onShowConfirm }) => {
            const hasHistory = module.history && module.history.length > 0;

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-xl w-full max-w-3xl h-[80vh] shadow-2xl border border-gray-200 overflow-hidden flex flex-col">
                        <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-50">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <History size={20} className="text-blue-600" />
                                PNL-{module.panelId} / Mod-{module.moduleId} 이력 관리
                            </h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full"><X size={20} className="text-gray-500" /></button>
                        </div>
                        <div className="flex-1 overflow-auto p-0 custom-scrollbar">
                            {/* PC 버전: 테이블 레이아웃 */}
                            <div className="hidden md:block">
                                <table className="w-full text-sm text-left text-gray-500">
                                    <thead className="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-6 py-3 w-1/4">일시</th>
                                            <th className="px-6 py-3 w-24">상태</th>
                                            <th className="px-6 py-3 w-32">작업자</th>
                                            <th className="px-6 py-3">내용</th>
                                            <th className="px-6 py-3 w-20 text-right">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {!hasHistory ? (
                                            <tr><td colSpan="5" className="px-6 py-10 text-center text-gray-400">해당 모듈에 기록된 이력이 없습니다.</td></tr>
                                        ) : (
                                            module.history.map((item, index) => {
                                                const style = getStatusStyle(item.status);
                                                return (
                                                    <tr key={item.date + index} className="bg-white border-b hover:bg-gray-50">
                                                        <td className="px-6 py-4 font-mono text-xs whitespace-nowrap">{item.date}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap">
                                                            <span className={`px-3 py-1 rounded-full text-xs font-bold border ${style.bg} ${style.border} ${style.text}`}>
                                                                {item.status === 'NORMAL' ? '정상' : (item.status === 'CHECK' ? '모듈' : '기타')}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 font-medium text-gray-900 whitespace-nowrap"><SafeText value={item.tech} fallback="-" /></td>
                                                        <td className="px-6 py-4 text-gray-600 whitespace-pre-wrap text-xs"><SafeText value={item.action} /></td>
                                                        <td className="px-6 py-4 text-right">
                                                            <button
                                                                onClick={() => onShowConfirm(item)}
                                                                className="p-1 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded"
                                                                title="이력 삭제"
                                                            >
                                                                <Trash2 size={14} />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* 모바일 버전: 카드 레이아웃 */}
                            <div className="md:hidden p-4 space-y-4">
                                {!hasHistory ? (
                                    <div className="py-10 text-center text-gray-400">해당 모듈에 기록된 이력이 없습니다.</div>
                                ) : (
                                    module.history.map((item, index) => {
                                        const style = getStatusStyle(item.status);
                                        return (
                                            <div key={item.date + index} className="app-card bg-white rounded-lg border border-gray-200 p-4 shadow-sm space-y-3 relative">
                                                <div className="flex justify-between items-start">
                                                    <div className="space-y-1">
                                                        <div className="text-[10px] font-mono text-gray-400">{item.date}</div>
                                                        <div className="flex items-center gap-2">
                                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${style.bg} ${style.border} ${style.text}`}>
                                                                {item.status === 'NORMAL' ? '정상' : (item.status === 'CHECK' ? '모듈' : '기타')}
                                                            </span>
                                                            <span className="text-xs font-bold text-gray-900"><SafeText value={item.tech} fallback="-" /></span>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => onShowConfirm(item)}
                                                        className="p-2 text-rose-500 hover:bg-rose-50 rounded-full"
                                                    >
                                                        <Trash2 size={16} />
                                                    </button>
                                                </div>
                                                <div className="text-xs text-gray-600 bg-gray-50 p-2 rounded border border-gray-100 whitespace-pre-wrap leading-relaxed italic">
                                                    <SafeText value={item.action} />
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HistorySheet = ({ panels, onClose, onShowConfirm }) => {
            const allHistory = useMemo(() => {
                const historyList = [];
                if (!panels) return [];
                Object.keys(panels).forEach(panelId => {
                    panels[panelId].forEach(module => {
                        if (module.history && module.history.length > 0) {
                            module.history.forEach(h => {
                                historyList.push({
                                    ...h,
                                    panelId,
                                    moduleId: module.moduleId,
                                    key: `${panelId}-${module.moduleId}-${h.date}`
                                });
                            });
                        }
                    });
                });
                return historyList.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [panels]);

            const downloadCSV = () => {
                if (allHistory.length === 0) {
                    const customAlert = document.createElement('div');
                    customAlert.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100]';
                    customAlert.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-xl"><p class="text-lg font-bold mb-4">⚠️ 다운로드할 데이터가 없습니다.</p><button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700" onclick="this.parentNode.parentNode.remove()">확인</button></div>`;
                    document.body.appendChild(customAlert);
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "일시,패널ID,모듈ID,상태,작업자,내용/코드\n";
                allHistory.forEach(item => {
                    const safeAction = item.action ? item.action.replace(/,/g, " ").replace(/\n/g, " ") : "";
                    const safeTech = item.tech ? item.tech.replace(/,/g, " ").replace(/\n/g, " ") : "";
                    const statusText = item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타';
                    const row = [item.date, `PNL-${item.panelId}`, `Mod-${item.moduleId}`, statusText, safeTech, safeAction].join(",");
                    csvContent += row + "\n";
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `history_export.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-xl w-full max-w-4xl h-[80vh] shadow-2xl border border-gray-200 overflow-hidden flex flex-col">
                        <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-50">
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2"><FileText size={20} className="text-blue-600" />통합 이력 대장</h2>
                            <div className="flex items-center gap-2">
                                <button onClick={downloadCSV} className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-md hover:bg-emerald-700 transition-colors shadow-sm"><Download size={14} /> 엑셀 다운로드</button>
                                <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full"><X size={20} className="text-gray-500" /></button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-auto p-0 custom-scrollbar">
                            {/* PC 버전: 테이블 레이아웃 */}
                            <div className="hidden md:block">
                                <table className="w-full text-sm text-left text-gray-500">
                                    <thead className="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0 z-10">
                                        <tr>
                                            <th className="px-6 py-3 border-b w-48">일시</th>
                                            <th className="px-6 py-3 border-b w-40">위치</th>
                                            <th className="px-6 py-3 border-b w-24">상태</th>
                                            <th className="px-6 py-3 border-b w-32">작업자</th>
                                            <th className="px-6 py-3 border-b">내용</th>
                                            <th className="px-6 py-3 border-b w-20 text-right">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {allHistory.length === 0 ? (
                                            <tr><td colSpan="6" className="px-6 py-10 text-center text-gray-400">기록이 없습니다.</td></tr>
                                        ) : (
                                            allHistory.map((item) => {
                                                const style = getStatusStyle(item.status);
                                                return (
                                                    <tr key={item.key} className="bg-white border-b hover:bg-gray-50">
                                                        <td className="px-6 py-4 font-mono text-xs whitespace-nowrap">{item.date}</td>
                                                        <td className="px-6 py-4 font-bold text-slate-700 whitespace-nowrap">PNL-{item.panelId} / Mod-{item.moduleId}</td>
                                                        <td className="px-6 py-4 whitespace-nowrap"><span className={`px-3 py-1 rounded-full text-xs font-bold border ${style.bg} ${style.border} ${style.text}`}>{getStatusIcon(item.status)} {item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타'}</span></td>
                                                        <td className="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">{item.tech || '-'}</td>
                                                        <td className="px-6 py-4 text-gray-600 whitespace-pre-wrap"><SafeText value={item.action} /></td>
                                                        <td className="px-6 py-4 text-right">
                                                            <button
                                                                onClick={() => onShowConfirm({ panelId: item.panelId, moduleId: item.moduleId }, item)}
                                                                className="p-1 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded"
                                                                title="이력 삭제"
                                                            >
                                                                <Trash2 size={14} />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* 모바일 버전: 카드 레이아웃 */}
                            <div className="md:hidden p-3 bg-gray-50 space-y-3">
                                {allHistory.length === 0 ? (
                                    <div className="py-10 text-center text-gray-400">기록이 없습니다.</div>
                                ) : (
                                    allHistory.map((item) => {
                                        const style = getStatusStyle(item.status);
                                        return (
                                            <div key={item.key} className="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                                                <div className="p-3 border-b border-gray-100 flex justify-between items-center bg-white">
                                                    <div>
                                                        <div className="text-[10px] font-mono text-slate-400">{item.date}</div>
                                                        <div className="text-xs font-black text-slate-800">PNL-{item.panelId} / Mod-{item.moduleId}</div>
                                                    </div>
                                                    <button
                                                        onClick={() => onShowConfirm({ panelId: item.panelId, moduleId: item.moduleId }, item)}
                                                        className="p-2 text-rose-500 hover:bg-rose-50 rounded-full"
                                                    >
                                                        <Trash2 size={16} />
                                                    </button>
                                                </div>
                                                <div className="p-3 space-y-2">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${style.bg} ${style.border} ${style.text}`}>
                                                            {getStatusIcon(item.status)} {item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타'}
                                                        </span>
                                                        <span className="text-xs font-bold text-slate-700">{item.tech || '-'}</span>
                                                    </div>
                                                    <div className="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 whitespace-pre-wrap italic">
                                                        <SafeText value={item.action} />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- NEW: Global History Sheet (All Zones) ---
        const GlobalHistorySheet = ({ dataCache, onClose }) => {
            const allHistory = useMemo(() => {
                const list = [];
                if (!dataCache) return [];

                Object.entries(dataCache).forEach(([docId, panels]) => {
                    const [zone, side] = docId.split('-');
                    if (!panels) return;

                    Object.keys(panels).forEach(panelId => {
                        panels[panelId].forEach(module => {
                            if (module.history && module.history.length > 0) {
                                module.history.forEach(h => {
                                    list.push({
                                        ...h,
                                        fullLocation: `${zone} ${side}-SIDE PNL-${panelId} / Mod-${module.moduleId}`,
                                        key: `${docId}-${panelId}-${module.moduleId}-${h.date}`
                                    });
                                });
                            }
                        });
                    });
                });
                return list.sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [dataCache]);

            const downloadCSV = () => {
                if (allHistory.length === 0) {
                    const customAlert = document.createElement('div');
                    customAlert.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100]';
                    customAlert.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-xl"><p class="text-lg font-bold mb-4">⚠️ 다운로드할 데이터가 없습니다.</p><button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700" onclick="this.parentNode.parentNode.remove()">확인</button></div>`;
                    document.body.appendChild(customAlert);
                    return;
                }

                let csvContent = "\uFEFF";
                csvContent += "일시,위치,상태,작업자,내용/코드\n";
                allHistory.forEach(item => {
                    const safeAction = item.action ? item.action.replace(/,/g, " ").replace(/\n/g, " ") : "";
                    const safeTech = item.tech ? item.tech.replace(/,/g, " ").replace(/\n/g, " ") : "";
                    const statusText = item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타';
                    const row = [item.date, item.fullLocation, statusText, safeTech, safeAction].join(",");
                    csvContent += row + "\n";
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `global_history_export.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-xl w-full max-w-5xl h-[85vh] shadow-2xl border border-gray-200 overflow-hidden flex flex-col">
                        <div className="px-4 md:px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-800 text-white">
                            <h2 className="text-lg md:text-xl font-bold flex items-center gap-2 md:gap-3">
                                <List size={20} className="shrink-0" />
                                <div className="flex flex-col md:flex-row md:items-baseline md:gap-2 leading-tight">
                                    <span>종합 이력 대장</span>
                                    <span className="text-[10px] md:text-xs opacity-70 block md:inline-block font-medium">(전체 구역)</span>
                                </div>
                            </h2>
                            <div className="flex items-center gap-2">
                                <button onClick={downloadCSV} className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500 text-white text-xs font-bold rounded-md hover:bg-emerald-600 transition-colors shadow-sm"><Download size={14} /> 전체 엑셀 다운로드</button>
                                <button onClick={onClose} className="p-2 hover:bg-slate-700 rounded-full"><X size={20} className="text-slate-300 hover:text-white" /></button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-auto p-0 custom-scrollbar">
                            {/* PC 버전: 테이블 레이아웃 */}
                            <div className="hidden md:block">
                                <table className="w-full text-sm text-left text-gray-500">
                                    <thead className="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0 z-10 shadow-sm">
                                        <tr>
                                            <th className="px-6 py-3 border-b w-48">일시</th>
                                            <th className="px-6 py-3 border-b w-64">전체 위치</th>
                                            <th className="px-6 py-3 border-b w-24">상태</th>
                                            <th className="px-6 py-3 border-b w-32">작업자</th>
                                            <th className="px-6 py-3 border-b">내용</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {allHistory.length === 0 ? (
                                            <tr><td colSpan="5" className="px-6 py-10 text-center text-gray-400">전체 기록이 없습니다.</td></tr>
                                        ) : (
                                            allHistory.map((item) => {
                                                const style = getStatusStyle(item.status);
                                                return (
                                                    <tr key={item.key} className="bg-white border-b hover:bg-gray-50">
                                                        <td className="px-6 py-4 font-mono text-xs text-slate-500 whitespace-nowrap">{item.date}</td>
                                                        <td className="px-6 py-4 font-bold text-slate-800 whitespace-nowrap"><SafeText value={item.fullLocation} /></td>
                                                        <td className="px-6 py-4 whitespace-nowrap"><span className={`px-3 py-1 rounded-full text-xs font-bold border ${style.bg} ${style.border} ${style.text}`}>{getStatusIcon(item.status)} {item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타'}</span></td>
                                                        <td className="px-6 py-4 font-medium text-gray-900 whitespace-nowrap"><SafeText value={item.tech} fallback="-" /></td>
                                                        <td className="px-6 py-4 text-gray-600 whitespace-pre-wrap"><SafeText value={item.action} /></td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {/* 모바일 버전: 카드 레이아웃 */}
                            <div className="md:hidden p-3 bg-gray-100 space-y-3">
                                {allHistory.length === 0 ? (
                                    <div className="py-10 text-center text-gray-400">전체 기록이 없습니다.</div>
                                ) : (
                                    allHistory.map((item) => {
                                        const style = getStatusStyle(item.status);
                                        return (
                                            <div key={item.key} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                                                <div className="p-3 border-b border-gray-100 bg-slate-50">
                                                    <div className="text-[10px] font-mono text-slate-400">{item.date}</div>
                                                    <div className="text-xs font-black text-slate-800 uppercase tracking-tight">{item.fullLocation}</div>
                                                </div>
                                                <div className="p-3 space-y-2">
                                                    <div className="flex items-center gap-2">
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${style.bg} ${style.border} ${style.text}`}>
                                                            {getStatusIcon(item.status)} {item.status === 'NORMAL' ? '정상' : item.status === 'CHECK' ? '모듈' : '기타'}
                                                        </span>
                                                        <span className="text-xs font-bold text-slate-700"><SafeText value={item.tech} fallback="-" /></span>
                                                    </div>
                                                    <div className="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100 whitespace-pre-wrap leading-relaxed">
                                                        <SafeText value={item.action} />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                        <div className="px-6 py-3 bg-gray-50 border-t text-xs text-right text-gray-500">
                            총 {allHistory.length}개의 이력이 조회되었습니다. (삭제는 상세 화면에서만 가능합니다)
                        </div>
                    </div>
                </div>
            );
        };

        const PanelCard = ({ id, data, onClick }) => {
            const errorCount = data ? data.filter(m => m.status === 'ERROR').length : 0;
            const warningCount = data ? data.filter(m => m.status === 'CHECK').length : 0;
            const isClean = errorCount === 0 && warningCount === 0;
            let borderColor = 'border-slate-300', bgColor = 'bg-white', shadow = 'shadow-sm hover:shadow-md';
            if (errorCount > 0) { borderColor = 'border-rose-400'; bgColor = 'bg-rose-50/30'; shadow = 'shadow-md shadow-rose-100'; }
            else if (warningCount > 0) { borderColor = 'border-amber-400'; bgColor = 'bg-amber-50/30'; shadow = 'shadow-md shadow-amber-100'; }
            else { shadow = 'shadow-sm hover:shadow-md hover:shadow-slate-100'; }

            return (
                <button onClick={onClick} className={`relative w-full aspect-[4/3] p-5 rounded-lg border-2 transition-all text-left group flex flex-col justify-between ${borderColor} ${bgColor} ${shadow} hover:-translate-y-1`}>
                    <div className="flex justify-between items-start w-full">
                        <h3 className="font-black text-3xl text-slate-800 tracking-tight">PNL-<SafeText value={id} /></h3>
                        <div className={`w-4 h-4 rounded-full border-2 ${isClean ? 'bg-emerald-500 border-emerald-600' : errorCount > 0 ? 'bg-rose-500 border-rose-600 animate-pulse' : 'bg-amber-500 border-amber-600'}`}></div>
                    </div>
                    <div className="w-full">
                        <div className="h-px bg-slate-200 w-full mb-3"></div>
                        <div className="flex justify-between items-center text-sm font-bold text-slate-500">
                            <span>Modules: {data ? data.length : 0}</span>
                            {!isClean && <div className="flex gap-2">{errorCount > 0 && <span className="text-rose-600">기타: {errorCount}</span>}{warningCount > 0 && <span className="text-amber-600">모듈: {warningCount}</span>}</div>}
                            {isClean && <span className="text-emerald-600">정상</span>}
                        </div>
                    </div>
                </button>
            );
        };

        const PanelPopup = ({ panelId, data, onClose, onModuleClick }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-xl w-full max-w-2xl shadow-2xl border border-gray-200 overflow-hidden ring-1 ring-gray-200">
                        <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <h2 className="text-xl font-bold text-gray-900 flex items-center gap-3"><span className="w-2 h-6 bg-slate-800 rounded-sm"></span>PNL-{panelId} 모듈 상세 정보</h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full"><X size={20} className="text-gray-500" /></button>
                        </div>
                        <div className={`p-8 grid gap-4 bg-white ${data.length <= 4 ? 'grid-cols-2 md:grid-cols-4' : 'grid-cols-3 md:grid-cols-6'}`}>
                            {data.map((module) => {
                                const style = getStatusStyle(module.status);
                                let statusText = module.status === 'CHECK' ? '모듈 고장' : (module.status === 'ERROR' ? '기타 고장' : module.status);
                                return (
                                    <button key={module.id} onClick={() => onModuleClick(module)} className={`relative aspect-square rounded-lg border-2 flex flex-col items-center justify-center gap-2 transition-all hover:shadow-md hover:-translate-y-1 ${style.ring} ${style.bg} ${style.border}`}>
                                        <span className={`text-2xl font-black tabular-nums ${style.text}`}><SafeText value={module.moduleId} /></span>
                                        <span className={`text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 ${style.text}`}>{getStatusIcon(module.status, 10)} {statusText}</span>
                                        {module.status === 'ERROR' && <span className="absolute -top-1 -right-1 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span></span>}
                                    </button>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const ModuleDialog = ({ module, onClose, onUpdate, onHistoryManagement, isUpdating }) => {
            // [수정] 초기 로드 시 '내용없음'이나 '초기화됨' 텍스트는 빈 값으로 설정하여 바로 입력 가능하게 함
            const [form, setForm] = useState(() => {
                const isDefault = module.memo === '내용없음' || module.memo === '초기화됨';
                return { ...module, errorCode: module.errorCode || '', memo: isDefault ? '' : module.memo };
            });
            const currentErrorCodes = form.status === 'CHECK' ? CHECK_CODES : (form.status === 'ERROR' ? ERROR_CODES : []);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/20 backdrop-blur-[2px] p-4">
                    <div className="bg-white rounded-xl w-full max-w-sm shadow-xl border border-gray-200 overflow-hidden">
                        <div className="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                            <div><h2 className="text-lg font-bold text-gray-900">Module {module.moduleId}</h2><p className="text-xs text-gray-500">Panel {module.panelId} 설정</p></div>
                            <button onClick={onClose} className="p-1.5 hover:bg-gray-200 rounded-full text-gray-500"><X size={18} /></button>
                        </div>
                        <div className="p-5 space-y-5 bg-white max-h-[70vh] overflow-y-auto custom-scrollbar">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">상태 변경</label>
                                <div className="grid grid-cols-3 gap-2">
                                    {['NORMAL', 'CHECK', 'ERROR'].map(status => (
                                        <button key={status} onClick={() => setForm({ ...form, status, errorCode: '' })} className={`py-2 rounded-md text-xs font-bold border ${form.status === status ? `bg-slate-800 text-white` : 'border-gray-200 text-gray-500'}`}>{status === 'NORMAL' ? '정상' : (status === 'CHECK' ? '모듈 고장' : '기타 고장')}</button>
                                    ))}
                                </div>
                            </div>
                            {form.status !== 'NORMAL' && currentErrorCodes.length > 0 && (
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-2">고장 코드 선택</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {currentErrorCodes.map((ec) => (
                                            <button key={ec.code} onClick={() => setForm({ ...form, errorCode: ec.code })} className={`px-3 py-3 text-xs font-semibold rounded border text-left ${form.errorCode === ec.code ? 'bg-slate-800 text-white' : 'bg-white'}`}><span className="block font-black text-[10px] opacity-70 mb-0.5">{ec.code}</span>{ec.label}</button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="space-y-3">
                                <div className="space-y-1"><label className="text-xs text-gray-500">작업자</label><input type="text" value={form.technician} onChange={e => setForm({ ...form, technician: e.target.value })} className="w-full border rounded-md px-3 py-2 text-sm" placeholder="작업자 이름" /></div>
                                <div className="space-y-1"><label className="text-xs text-gray-500">메모</label>
                                    <textarea
                                        value={form.memo}
                                        onChange={e => setForm({ ...form, memo: e.target.value })}
                                        className="w-full border rounded-md px-3 py-2 text-sm h-24 resize-none text-gray-900 placeholder:text-gray-400"
                                        placeholder="내용 입력..."
                                    />
                                </div>
                            </div>
                        </div>
                        <div className="p-4 bg-gray-50 border-t flex justify-between gap-2">
                            <button onClick={() => onHistoryManagement(module)} className="px-3 py-2 rounded-md text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 flex items-center gap-1.5 border border-slate-200"><History size={14} /> 이력 관리 ({module.history?.length || 0})</button>
                            <div className='flex gap-2'>
                                <button onClick={onClose} className="px-4 py-2 rounded-md text-xs font-bold text-gray-600 hover:bg-gray-200">닫기</button>
                                <button onClick={() => onUpdate(form)} disabled={isUpdating} className="px-4 py-2 rounded-md text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed">
                                    {isUpdating ? <RefreshCw size={14} className="animate-spin" /> : <Save size={14} />} 저장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ZoneCard = ({ zone, onClick }) => {
            const isError = zone.status === 'Error';
            return (
                <button onClick={() => onClick(zone.id)} className={`group relative w-32 h-20 rounded-xl transition-all duration-500 flex flex-col items-center justify-center p-2 border overflow-hidden ${isError ? 'bg-white border-rose-100 shadow-md' : 'bg-white border-blue-100 shadow-md'} hover:-translate-y-1`}>
                    <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${isError ? 'from-rose-400 to-orange-400' : 'from-blue-400 to-cyan-400'}`}></div>
                    <div className="flex flex-col items-center z-10"><span className="text-3xl font-black text-slate-800">{zone.name}</span></div>
                </button>
            );
        };

        const SummaryCard = ({ title, count, color, onClick, isSelected, icon: Icon = Activity }) => {
            return (
                <button onClick={onClick} className={`relative overflow-hidden rounded-xl bg-white border p-4 text-left shadow-sm transition-all hover:shadow-md hover:-translate-y-1 ${isSelected ? `ring-2 ring-${color}-500` : ''}`}>
                    <div className={`absolute top-0 right-0 p-3 opacity-10 text-${color}-500`}><Icon size={40} /></div>
                    <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">{title}</p>
                    <div className="flex items-end gap-2"><span className={`text-3xl font-black text-${color}-600 leading-none`}>{count}</span><span className="text-xs text-gray-500 font-medium mb-1">건</span></div>
                </button>
            );
        };

        // --- Layouts ---

        const FieldLayout = ({ onBack, layoutId, globalData, updateGlobalData }) => {
            const [currentSide, setCurrentSide] = useState('A');
            const [selectedPanel, setSelectedPanel] = useState(null);
            const [selectedModule, setSelectedModule] = useState(null);
            const [showHistorySheet, setShowHistorySheet] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [bgSyncing, setBgSyncing] = useState(false);

            const [historyModule, setHistoryModule] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);

            const isFetching = useRef(false);
            const timeoutRef = useRef(null);

            const docId = `${layoutId}-${currentSide}`;

            // 캐시된 데이터 즉시 사용
            const panels = globalData[docId] || null;

            const fetchPanels = async (side, isBackground = false) => {
                if (isFetching.current) return;
                isFetching.current = true;

                const currentDocId = `${layoutId}-${side}`;

                // [변경] 데이터가 아예 없을 때만 로딩 표시.
                if (!globalData[currentDocId]) {
                    setLoading(true);
                } else {
                    setBgSyncing(true); // 이미 데이터가 있으면 백그라운드 싱크 모드
                }

                try {
                    let data = await SheetsAPIService.getDoc(currentDocId);

                    if (!data) {
                        console.warn("Data missing/corrupted. Initializing local data...");
                        data = generateData(layoutId);
                        SheetsAPIService.setDoc(currentDocId, data).catch(err => {
                            console.error("Background repair failed:", err);
                        });
                    }
                    // 전역 데이터 업데이트 (화면 즉시 반영)
                    updateGlobalData(currentDocId, data.panels);
                    setError(null);
                } catch (e) {
                    console.error("Data fetch failed:", e);
                    // 데이터가 없는데 실패했을 때만 에러 표시
                    if (!globalData[currentDocId]) {
                        setError(`연결 실패: ${e.message}`);
                    }
                } finally {
                    setLoading(false);
                    setBgSyncing(false);
                    isFetching.current = false;
                }
            }

            const handleHistoryDelete = async (module, record) => {
                setDeleteConfirm(null);
                // 낙관적 업데이트: 로컬 데이터 즉시 수정

                const panelId = module.panelId;
                const moduleId = module.moduleId;
                const dateToDelete = record.date;
                const currentDocId = `${layoutId}-${currentSide}`;

                const newPanels = { ...panels };
                const moduleList = newPanels[panelId];
                const moduleIndex = moduleList.findIndex(m => m.moduleId === moduleId);

                if (moduleIndex === -1) return;

                moduleList[moduleIndex].history = moduleList[moduleIndex].history.filter(
                    h => h.date !== dateToDelete
                );

                // UI 즉시 반영
                updateGlobalData(currentDocId, newPanels);
                if (historyModule) {
                    setHistoryModule(prev => ({ ...prev, history: moduleList[moduleIndex].history }));
                }

                // 백그라운드 저장 (저장 시에는 표시)
                setBgSyncing(true);
                try {
                    await SheetsAPIService.setDoc(currentDocId, { panels: newPanels });
                } catch (e) {
                    console.error("History delete failed:", e);
                    alert(`이력 삭제가 서버에 반영되지 않았습니다: ${e.message}`);
                } finally {
                    setBgSyncing(false);
                }
            };

            const handleGlobalHistoryDeleteConfirm = (moduleSimple, record) => {
                setDeleteConfirm({ module: moduleSimple, record });
            };


            useEffect(() => {
                // 사이드 변경 시 데이터가 없으면 즉시 로딩 시작
                // 데이터가 있어도 최신화를 위해 백그라운드 로딩 시작
                fetchPanels(currentSide);

                // Polling 제거 (요청에 따라) -> 필요할 때만 호출
                // const startPolling = () => { ... }
                // startPolling();

            }, [currentSide]);


            const handleUpdate = async (formData) => {
                if (!panels) return;

                const currentModuleList = panels[formData.panelId];
                const oldModule = currentModuleList.find(m => m.moduleId === formData.moduleId);

                const hasChanged = oldModule.status !== formData.status ||
                    oldModule.technician !== formData.technician ||
                    oldModule.memo !== formData.memo ||
                    oldModule.errorCode !== formData.errorCode;

                if (!hasChanged) {
                    const customAlert = document.createElement('div');
                    customAlert.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100]';
                    customAlert.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-xl"><p class="text-lg font-bold mb-4">⚠️ 변경 사항 없음</p><button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700" onclick="this.parentNode.parentNode.remove()">확인</button></div>`;
                    document.body.appendChild(customAlert);
                    setSelectedModule(null);
                    return;
                }

                // --- Optimistic Update (낙관적 업데이트) ---
                const newPanels = { ...panels };
                const list = newPanels[formData.panelId];
                const idx = list.findIndex(m => m.moduleId === formData.moduleId);

                let actionText = formData.memo;
                let codeLabel = '';
                if (formData.errorCode) {
                    if (formData.status === 'CHECK') codeLabel = CHECK_CODES.find(c => c.code === formData.errorCode)?.label || '모듈 고장';
                    else if (formData.status === 'ERROR') codeLabel = ERROR_CODES.find(c => c.code === formData.errorCode)?.label || '기타 고장';
                }

                const statusChangeText = oldModule.status !== formData.status ? `[상태변경: ${oldModule.status} -> ${formData.status}] ` : '';
                const codeText = codeLabel ? `[${formData.errorCode}] ${codeLabel}` : '';

                actionText = `${statusChangeText}${codeText} ${formData.memo || '(메모 없음)'}`.trim();

                const newHistoryItem = {
                    date: new Date().toLocaleString(),
                    action: actionText,
                    tech: formData.technician,
                    status: formData.status,
                    errorCode: formData.errorCode || ''
                };

                list[idx] = { ...list[idx], ...formData, history: [newHistoryItem, ...(oldModule.history || [])] };

                // 전역 상태 업데이트 -> 화면 즉시 반영
                updateGlobalData(docId, newPanels);
                setSelectedModule(null); // 모달 닫기

                // 2. 서버 저장은 백그라운드에서 수행 (저장 시에는 표시)
                setBgSyncing(true);
                try {
                    await SheetsAPIService.setDoc(docId, { panels: newPanels });
                }
                catch (e) {
                    console.error("Save failed:", e);
                    const customAlert = document.createElement('div');
                    customAlert.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100]';
                    customAlert.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-xl"><p class="text-lg font-bold mb-4">❌ 저장 실패 (동기화 오류)</p><p class="text-sm text-gray-600 mb-4">${e.message}</p><button class="bg-rose-600 text-white px-4 py-2 rounded-md hover:bg-rose-700" onclick="this.parentNode.parentNode.remove()">확인</button></div>`;
                    document.body.appendChild(customAlert);
                    // 실패 시 롤백 로직을 추가할 수도 있습니다.
                } finally {
                    setBgSyncing(false);
                }
            };

            const handleHistoryManagement = (module) => {
                setSelectedModule(null);
                setHistoryModule(module);
            };

            const handleShowDeleteConfirm = (record) => {
                setDeleteConfirm({ module: historyModule, record });
            };


            return (
                <div className="min-h-screen selection:bg-slate-200 relative fade-in">
                    <button onClick={onBack} className="absolute top-8 left-8 p-3 rounded-full bg-white/50 backdrop-blur-md shadow-sm hover:bg-white text-slate-400 hover:text-slate-600 transition-all z-40 md:top-12 md:left-12"><ArrowLeft size={24} /></button>

                    <div className="absolute top-8 right-8 z-40 flex items-center gap-3 md:top-12 md:right-12">
                        {loading || bgSyncing ? (
                            <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1.5 bg-white/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/50 animate-pulse transition-all"><RefreshCw size={12} className='animate-spin' /> {loading ? "로딩 중..." : "저장 중..."}</span>
                        ) : error ? (
                            <span className="text-[10px] font-bold text-rose-500 flex items-center gap-1.5 bg-rose-50/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-rose-100" title={error}><TriangleAlert size={12} /> 연결 불안정</span>
                        ) : (
                            <span className="text-[10px] font-bold text-emerald-600 flex items-center gap-1.5 bg-emerald-50/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-emerald-100 transition-all"><Cloud size={12} /> 클라우드 동기화</span>
                        )}
                        <button onClick={() => setShowHistorySheet(true)} className="px-5 py-2.5 bg-slate-800 text-white text-xs font-bold rounded-full shadow-lg hover:bg-slate-700 hover:-translate-y-0.5 transition-all flex items-center gap-2"><FileText size={14} /> 이력 대장</button>
                    </div>

                    <div className="max-w-7xl mx-auto p-8 pt-20">
                        <div className="flex justify-between items-center mb-8">
                            <div className="bg-slate-100 p-1 rounded-lg inline-flex shadow-inner">
                                <button onClick={() => setCurrentSide('A')} className={`px-8 py-2.5 rounded-md text-sm font-black transition-all ${currentSide === 'A' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>A-SIDE</button>
                                <button onClick={() => setCurrentSide('B')} className={`px-8 py-2.5 rounded-md text-sm font-black transition-all ${currentSide === 'B' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>B-SIDE</button>
                            </div>
                        </div>
                        <div className="flex justify-between items-end mb-10 border-b-2 border-gray-200 pb-4">
                            <h2 className="text-2xl font-black text-gray-900 flex items-center gap-3"><span className="text-blue-600">{layoutId.replace('ZONE ', '#')}</span> {currentSide}-SIDE EP TR PANEL</h2>
                        </div>

                        {loading && !panels && (
                            <div className="w-full h-96 flex flex-col items-center justify-center text-gray-300 gap-4">
                                <div className="w-12 h-12 border-4 border-slate-200 border-t-blue-500 rounded-full animate-spin"></div>
                                <p className="text-sm font-bold text-slate-400">데이터 동기화 중...</p>
                            </div>
                        )}

                        {!loading && error && !panels && (
                            <div className="w-full h-96 flex flex-col items-center justify-center text-rose-500 gap-4 p-4 text-center">
                                <TriangleAlert size={48} className="opacity-20 mb-2" />
                                <p className="text-xl font-black italic">DATABASE OFFLINE</p>
                                <p className="text-sm text-gray-400 max-w-xs">{error}</p>
                                <button onClick={() => window.location.reload()} className="mt-4 px-8 py-3 bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition-all font-bold">RECONNECT</button>
                            </div>
                        )}

                        {panels && (
                            <div className="flex flex-col gap-8 w-full animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6 w-full">
                                    {['31', '21', '22', '32'].map(id => <PanelCard key={id} id={id} data={panels ? panels[id] : []} onClick={() => { if (layoutId === 'ZONE 4') { setSelectedModule(panels[id][0]); } else { setSelectedPanel(id); } }} />)}
                                </div>
                                <div className="flex gap-6 w-full md:w-1/2 mx-auto">
                                    {['11', '12'].map(id => <PanelCard key={id} id={id} data={panels ? panels[id] : []} onClick={() => { if (layoutId === 'ZONE 4') { setSelectedModule(panels[id][0]); } else { setSelectedPanel(id); } }} />)}
                                </div>
                            </div>
                        )}
                    </div>
                    {selectedPanel && panels && <PanelPopup panelId={selectedPanel} data={panels[selectedPanel]} onClose={() => setSelectedPanel(null)} onModuleClick={setSelectedModule} />}
                    {selectedModule && <ModuleDialog module={selectedModule} onClose={() => setSelectedModule(null)} onUpdate={handleUpdate} onHistoryManagement={handleHistoryManagement} isUpdating={bgSyncing} />}
                    {showHistorySheet && <HistorySheet panels={panels} onClose={() => setShowHistorySheet(false)} onShowConfirm={handleGlobalHistoryDeleteConfirm} />}

                    {historyModule && (
                        <ModuleHistoryManager
                            module={historyModule}
                            onClose={() => setHistoryModule(null)}
                            onShowConfirm={handleShowDeleteConfirm}
                        />
                    )}

                    {deleteConfirm && (
                        <CustomConfirm
                            title="이력 기록 삭제"
                            message={`PNL-${deleteConfirm.module.panelId}/Mod-${deleteConfirm.module.moduleId}의 ${deleteConfirm.record.date} 기록을 정말로 삭제하시겠습니까?`}
                            onConfirm={() => handleHistoryDelete(deleteConfirm.module, deleteConfirm.record)}
                            onClose={() => setDeleteConfirm(null)}
                            confirmLabel="삭제"
                            confirmColor="bg-rose-600"
                        />
                    )}
                </div>
            );
        };

        const MainDashboard = ({ onSelectLayout, globalData, updateGlobalData }) => {
            const [summary, setSummary] = useState({ panelIssues: new Set(), moduleErrorCount: 0, otherErrorCount: 0, totalHistoryCount: 0, loading: true, issuesList: [] });
            const [selectedIssueType, setSelectedIssueType] = useState(null);
            const [showGlobalHistory, setShowGlobalHistory] = useState(false);
            const monitorTargets = ['ZONE 3-A', 'ZONE 3-B', 'ZONE 4-A', 'ZONE 4-B'];

            const isFetching = useRef(false);

            // globalData를 사용하여 summary 계산 (캐시된 데이터로 즉시 계산)
            useEffect(() => {
                let pIssues = new Set(), mCount = 0, oCount = 0, iList = [];
                let hCount = 0;
                Object.keys(globalData).forEach(key => {
                    const [zone, side] = key.split('-');
                    const panels = globalData[key];
                    if (!panels) return;
                    Object.keys(panels).forEach(pId => {
                        let panelHasIssue = false;
                        panels[pId].forEach(mod => {
                            if (mod.history) hCount += mod.history.length;
                            if (mod.status !== 'NORMAL') {
                                panelHasIssue = true;
                                let desc = mod.memo;
                                let statusType = '';
                                if (mod.status === 'CHECK') { mCount++; statusType = 'MODULE'; desc = '모듈 고장'; }
                                else if (mod.status === 'ERROR') { oCount++; statusType = 'OTHER'; desc = '기타 고장'; }
                                if (mod.errorCode) desc = `[${mod.errorCode}] ${desc}`;
                                iList.push({ key: `${key}-${pId}-${mod.moduleId}`, zone, side, panelId: pId, moduleId: mod.moduleId, status: mod.status, statusType, errorCode: mod.errorCode, desc });
                            }
                        });
                        if (panelHasIssue) pIssues.add(`${zone}-${side}-${pId}`);
                    });
                });
                // 데이터가 있으면 로딩 상태 해제
                setSummary(prev => ({ ...prev, panelIssues: pIssues, moduleErrorCount: mCount, otherErrorCount: oCount, totalHistoryCount: hCount, issuesList: iList, loading: false }));
            }, [globalData]);

            const fetchAllData = async () => {
                if (isFetching.current) return;
                isFetching.current = true;

                // 데이터가 하나도 없거나 수동 요청일 때만 loading 상태 사용
                const hasAnyData = Object.keys(globalData).length > 0;
                if (!hasAnyData) {
                    setSummary(prev => ({ ...prev, loading: true }));
                }

                for (const targetId of monitorTargets) {
                    try {
                        let result = await SheetsAPIService.getDoc(targetId);
                        if (!result) {
                            result = generateData(targetId.split('-')[0]);
                        }
                        if (result && result.panels) {
                            // 전역 상태 업데이트 -> 화면 즉시 반영
                            updateGlobalData(targetId, result.panels);
                        }
                    } catch (e) {
                        console.warn(`Failed to fetch ${targetId}:`, e);
                    }
                    await wait(10);
                }
                isFetching.current = false;
                setSummary(prev => ({ ...prev, loading: false }));
            };

            useEffect(() => {
                // 초기 1회 로드 (Polling 제거됨)
                fetchAllData();
            }, []);

            const filteredIssues = useMemo(() => {
                if (!selectedIssueType) return [];
                const issues = summary.issuesList.sort((a, b) => {
                    if (a.status === 'ERROR' && b.status !== 'ERROR') return -1;
                    if (a.status !== 'ERROR' && b.status === 'ERROR') return 1;
                    return (a.key > b.key) ? 1 : -1;
                });

                if (selectedIssueType === 'PANEL') {
                    const panelSet = new Set(), list = [];
                    issues.forEach(item => {
                        const key = `${item.zone}-${item.side}-${item.panelId}`;
                        if (!panelSet.has(key)) { panelSet.add(key); list.push({ ...item, isPanelSummary: true }); }
                    });
                    return list;
                }
                if (selectedIssueType === 'MODULE') return issues.filter(i => i.status === 'CHECK');
                if (selectedIssueType === 'OTHER') return issues.filter(i => i.status === 'ERROR');
                return [];
            }, [selectedIssueType, summary.issuesList]);

            const zones = [{ id: 'ZONE 3', name: '#3', status: 'Normal' }, { id: 'ZONE 4', name: '#4', status: 'Error' }];

            return (
                <div className="min-h-screen bg-white font-sans text-slate-900 relative overflow-hidden selection:bg-slate-200">
                    {/* Background mesh decor */}
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-50 rounded-full blur-[120px] opacity-60"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-slate-100 rounded-full blur-[120px] opacity-60"></div>
                    <main className="relative max-w-7xl mx-auto p-8 flex flex-col items-center justify-center min-h-screen">
                        <div className="w-full max-w-md space-y-8 flex flex-col items-center">
                            <div className="text-center space-y-2">
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">EP <span className="text-blue-400">Manager</span></h2>
                                <p className="text-sm text-slate-500 font-medium">관리할 호기(Unit)를 선택해주세요.</p>
                                <div className="text-[10px] text-emerald-600 font-bold mt-1">
                                    <Database size={12} className='inline mr-1' /> Google Sheets API Mode
                                </div>
                            </div>
                            <div className="flex flex-wrap justify-center gap-4">{zones.map(zone => <ZoneCard key={zone.id} zone={zone} onClick={onSelectLayout} />)}</div>
                        </div>
                        <div className="w-24 h-px bg-gray-200 my-10"></div>
                        <div className="w-full max-w-md"> {/* [변경] max-w-3xl -> max-w-md (상단과 폭 맞춤) */}
                            <div className="flex items-center justify-between mb-4 px-2">
                                <h3 className="text-sm font-bold text-gray-900 flex items-center gap-2"><Activity size={16} className="text-slate-800" />전체 현황 요약</h3>
                                <button onClick={fetchAllData} className="text-xs text-gray-400 hover:text-blue-600 flex items-center gap-1 transition-colors" disabled={summary.loading}>
                                    <RefreshCw size={10} className={summary.loading ? "animate-spin" : ""} /> {summary.loading ? "갱신 중..." : "새로고침"}
                                </button>
                            </div>
                            {/* [변경] grid-cols-2 (2x2 배치) */}
                            <div className="grid grid-cols-2 gap-4">
                                <SummaryCard title="종합 이력 대장" count={summary.totalHistoryCount} color="blue" onClick={() => setShowGlobalHistory(true)} icon={ClipboardList} />
                                <SummaryCard title="이상 TR (Panel)" count={summary.panelIssues.size} color="rose" onClick={() => setSelectedIssueType(prev => prev === 'PANEL' ? null : 'PANEL')} isSelected={selectedIssueType === 'PANEL'} icon={Zap} />
                                <SummaryCard title="이상 TR (모듈)" count={summary.moduleErrorCount} color="amber" onClick={() => setSelectedIssueType(prev => prev === 'MODULE' ? null : 'MODULE')} isSelected={selectedIssueType === 'MODULE'} icon={Activity} />
                                <SummaryCard title="기타 정비 (Note)" count={summary.otherErrorCount} color="slate" onClick={() => setSelectedIssueType(prev => prev === 'OTHER' ? null : 'OTHER')} isSelected={selectedIssueType === 'OTHER'} icon={Settings} />
                            </div>
                            {selectedIssueType && (
                                <div className="mt-6 bg-slate-50 rounded-xl border border-slate-200 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-300">
                                    <div className="px-4 py-3 border-b border-slate-200 flex justify-between items-center bg-slate-100/50"><h4 className="text-xs font-bold text-slate-700">상세 목록</h4><button onClick={() => setSelectedIssueType(null)} className="p-1 hover:bg-slate-200 rounded-full text-slate-400"><X size={14} /></button></div>
                                    <div className="max-h-60 overflow-y-auto p-2 space-y-2 custom-scrollbar">
                                        {filteredIssues.length === 0 ? <div className="text-center py-8 text-xs text-gray-400">내역 없음</div> : filteredIssues.map((item, idx) => (
                                            <div key={item.key} className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex items-center justify-between group hover:border-blue-200 transition-colors">
